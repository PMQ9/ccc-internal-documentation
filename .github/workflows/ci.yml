name: ci

# PR pipeline: prove the repo is shippable in minutes, with zero cloud creds.
# Every tool runs pinned (actions by commit SHA, scanners by image tag) so the
# pipeline is reproducible and the same versions run locally via `make check`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.13.3"

jobs:
  terraform:
    name: terraform · fmt · validate · tflint · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -recursive -check -diff
      - name: terraform init (no backend, no creds)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with:
          tflint_version: v0.63.1
      - name: tflint
        env:
          # `tflint --init` fetches the AWS ruleset from the GitHub releases API.
          # Unauthenticated that API is 60 req/hr per IP, shared across all GitHub-hosted
          # runners — so the download intermittently 403s ("rate limit exceeded"). The
          # auto-provided token lifts it to 1000 req/hr/repo (contents:read above suffices).
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init && tflint --recursive --format=compact
      - name: terraform test (plan-time security/edge assertions, mocked providers)
        run: terraform test

  iac-security:
    name: iac security · trivy · checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: trivy config scan (terraform)
        run: |
          docker run --rm -v "$PWD":/work -w /work aquasec/trivy:0.71.0 \
            config --exit-code 1 --severity HIGH,CRITICAL -q --ignorefile /work/.trivyignore terraform
      - name: checkov scan (terraform)
        run: |
          docker run --rm -v "$PWD":/work -w /work --entrypoint checkov \
            bridgecrew/checkov:3.2.532 -d terraform --config-file /work/.checkov.yaml --compact --quiet

  lint:
    name: lint · shell · compose · actions · pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: render user-data template for shellcheck
        run: ./tests/lib/render_user_data.sh > "$RUNNER_TEMP/user_data.rendered.sh"
      - name: shellcheck (incl. rendered user-data)
        run: |
          cp "$RUNNER_TEMP/user_data.rendered.sh" ./user_data.rendered.sh
          docker run --rm -v "$PWD":/work -w /work koalaman/shellcheck:v0.10.0 \
            --shell=bash --severity=warning \
            deploy/local/verify.sh deploy/local/dev-up.sh deploy/local/deploy-remote.sh deploy/local/snapshot.sh \
            deploy/local/apply-brand.sh deploy/local/apply-agent-role.sh \
            tests/lib/common.sh tests/lib/render_user_data.sh \
            tests/lib/check_pins.sh tests/lib/check_user_data_contract.sh tests/lib/check_theme_bridge.sh \
            tests/integration/run.sh tests/integration/helpers/load.bash user_data.rendered.sh
      - name: docker compose config validates
        run: |
          BOOKSTACK_TAG=test MARIADB_TAG=test APP_URL=http://localhost APP_KEY=base64:x \
            DB_ROOT_PASSWORD=x DB_PASSWORD=x \
            docker compose -f deploy/local/compose.yaml config -q
          echo "compose OK"
      - name: user-data contract (rendered template fetches secrets, bakes none)
        run: ./tests/lib/check_user_data_contract.sh
      - name: actionlint (CI lints itself)
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color
      - name: pins don't float + Makefile tool pins match CI (single source of truth)
        run: ./tests/lib/check_pins.sh
      - name: theme-bridge contract (wiki head == contact layout)
        run: ./tests/lib/check_theme_bridge.sh
      - name: stress driver self-test (offline pure-logic unit tests)
        run: python3 tests/stress/stress_selftest.py

  secrets:
    name: secrets · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: gitleaks (tree scan)
        run: |
          docker run --rm -v "$PWD":/work ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/work --config=/work/.gitleaks.toml --no-git --redact --verbose

  links:
    name: docs · link check (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: lychee (local file links only)
        run: |
          docker run --rm -v "$PWD":/work -w /work lycheeverse/lychee:0.15.1 \
            --offline --no-progress --exclude-path .github './**/*.md'

  wiki-client:
    name: wiki-client · gofmt + vet + test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: wiki-client core checks (gofmt, vet, race tests)
        run: |
          docker run --rm -v "$PWD":/work -w /work/services/wiki-client golang:1.23-alpine sh -c '
            test -z "$(gofmt -l .)" || { echo "gofmt drift:"; gofmt -l .; exit 1; }
            go vet ./...
            apk add --no-cache gcc musl-dev >/dev/null
            CGO_ENABLED=1 go test -race -count=1 ./...'

  contact-unit:
    name: contact · gofmt + vet + test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: contact service checks (gofmt, vet, race tests)
        run: |
          docker run --rm -v "$PWD":/work -w /work/services/contact golang:1.23-alpine sh -c '
            test -z "$(gofmt -l .)" || { echo "gofmt drift:"; gofmt -l .; exit 1; }
            go vet ./...
            apk add --no-cache gcc musl-dev >/dev/null
            CGO_ENABLED=1 go test -race -count=1 ./...'

  integration:
    name: integration · stack + bats + stress (PR profile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: run integration suite
        run: tests/integration/run.sh --profile pr
