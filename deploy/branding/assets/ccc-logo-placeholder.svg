<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER logo for the CCC docs wiki. Original, non-trademarked text mark.
  This is NOT a Vanderbilt logo, Star V, seal, or school lockup. Replace with the
  authorized CCC lockup from Vanderbilt Brand Communications before any external launch.
  Colors: black #1C1C1C, Oak gold #946E24, Flat gold #CFAE70 (CCC brand palette).
  Width 400px > the 250px web minimum for a primary lockup.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" width="400" height="96"
     role="img" aria-labelledby="ccc-logo-title ccc-logo-desc">
  <title id="ccc-logo-title">College of Connected Computing</title>
  <desc id="ccc-logo-desc">Placeholder wordmark — replace with the authorized CCC lockup.</desc>

  <!-- Accent mark: three stacked gold bars (a neutral, original glyph; not the Star V) -->
  <g>
    <rect x="8"  y="20" width="44" height="14" rx="2" fill="#946E24"/>
    <rect x="8"  y="41" width="44" height="14" rx="2" fill="#CFAE70"/>
    <rect x="8"  y="62" width="44" height="14" rx="2" fill="#1C1C1C"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="40"
        font-weight="700" fill="#1C1C1C" letter-spacing="1">CCC</text>
  <text x="73" y="74" font-family="system-ui, Arial, sans-serif" font-size="14"
        font-weight="500" fill="#946E24" letter-spacing="2.5">CONNECTED COMPUTING</text>
</svg>
