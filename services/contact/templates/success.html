<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Thanks — {{.WikiName}}</title>
  <style>
    :root { --ink: #1c1c1c; --surface: #ffffff; --chrome: #f5f3ef; --oak: #946e24; --border: #d9d4ca; --muted: #555; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f3f1ec; --surface: #1f1f1f; --chrome: #161616; --oak: #d8b65a; --border: #3a3a3a; --muted: #aaa; }
    }
    body { margin: 0; background: var(--chrome); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    header { background: #1c1c1c; color: #fff; padding: 16px 20px; border-bottom: 3px solid var(--oak); }
    header h1 { margin: 0; font: 600 18px/1.3 Georgia, "Times New Roman", serif; }
    main { max-width: 640px; margin: 24px auto; padding: 0 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    a { color: var(--oak); }
    .muted { color: var(--muted); }
    .btn { display: inline-block; margin-top: 16px; background: var(--oak); color: #fff;
           text-decoration: none; border-radius: 6px; padding: 10px 18px; font-weight: 600; }
  </style>
</head>
<body>
  <header><h1>{{.WikiName}} — Contact / Feedback</h1></header>
  <main>
    <div class="card">
      <h2>Thanks — your message is on its way.</h2>
      <p>We've sent it to the CCC admin team{{if .IssueURL}} and opened a tracking issue{{end}}. We'll follow up by email if needed.</p>
      {{if .IssueURL}}<p class="muted">Tracking issue: <a href="{{.IssueURL}}" rel="noopener noreferrer">{{.IssueURL}}</a></p>{{end}}
      <a class="btn" href="/contact">Send another</a>
    </div>
  </main>
</body>
</html>
