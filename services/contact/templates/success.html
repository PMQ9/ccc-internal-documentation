<!doctype html>
<html lang="en"{{if .ThemeClass}} class="{{.ThemeClass}}"{{end}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Thanks — {{.WikiName}}</title>
  <style>
    /* Palette + light/dark tokens live once in the shared "brand-head" template
       (issue #39); these rules only consume them via var(). */
    body { margin: 0; background: var(--chrome); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    /* Masthead (black bar + gold rule + logo) is the shared "masthead" template. */
    main { max-width: 640px; margin: 24px auto; padding: 0 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
    .card h1 { margin: 0 0 8px; font: 600 24px/1.25 Georgia, "Times New Roman", "Source Serif Pro", serif; }
    a { color: var(--oak); }
    .btn { display: inline-block; margin-top: 16px; background: var(--oak); color: #fff;
           text-decoration: none; border-radius: 6px; padding: 10px 18px; font-weight: 600; }
    .btn:hover { background: #7d5d1e; }
  </style>
  {{template "brand-head" .}}
</head>
<body>
  {{template "masthead" .}}
  <main>
    <div class="card">
      <h1>Thanks — we've received your request.</h1>
      <p>We'll follow up by email if needed.</p>
      <a class="btn" href="/contact">Send another</a>
    </div>
  </main>
  {{template "theme-script" .}}
</body>
</html>
